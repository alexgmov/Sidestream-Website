# Include beside the existing anonymous /analytics/ proxy. This endpoint is
# separately authenticated and must retain cookies and its custom CSRF header.
location ^~ /analytics/api/rollout-control/ {
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8790/;
    proxy_set_header Host 127.0.0.1:8790;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

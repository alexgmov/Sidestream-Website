# Installer bytes are served only after the loopback Node service authorizes the
# signed URL. The internal artifact location is impossible to request directly.
server {
    listen 80;
    listen [::]:80;
    server_name downloads.sidestream.tv;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name downloads.sidestream.tv;

    ssl_certificate /etc/letsencrypt/live/downloads.sidestream.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloads.sidestream.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    autoindex off;
    access_log /var/log/nginx/sidestream-downloads.log sidestream_download;
    error_log /var/log/nginx/sidestream-downloads-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ^~ /v1/ {
        limit_conn sidestream_download_connections 3;
        limit_req zone=sidestream_download_requests burst=6 nodelay;

        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host downloads.sidestream.tv;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location ^~ /__sidestream_artifacts/ {
        internal;
        alias /srv/sidestream/artifacts/;
        sendfile on;
        tcp_nopush on;
        aio threads;
        disable_symlinks on from=/srv/sidestream/artifacts;
        limit_rate_after 16m;
        limit_rate 12m;
    }

    location / {
        return 404;
    }
}

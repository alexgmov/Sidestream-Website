# Temporary HTTP-only site used solely for the first ACME certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name downloads.sidestream.tv;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

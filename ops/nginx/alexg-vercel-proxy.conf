# location context; retains canonical Host/SNI and verified upstream TLS.
proxy_pass https://$alexg_vercel_pool;
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name $host;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 3;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Sidestream-Origin-Auth "";
proxy_set_header X-Sidestream-Original-Host "";
proxy_set_header X-Vercel-Protection-Bypass "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";
proxy_connect_timeout 10s;
proxy_read_timeout 180s;
proxy_send_timeout 180s;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_cache off;
proxy_redirect off;
# Stream large assets without creating a second disk cache.
proxy_buffering off;
proxy_request_buffering on;

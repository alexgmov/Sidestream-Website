# http context. Resolve Vercel's assigned ingress, never the migrated hostname.
upstream alexg_vercel {
    zone alexg_vercel 64k;
    resolver 127.0.0.53 valid=300s ipv6=off;
    server 21c71053678bfaaf.vercel-dns-017.com:443 resolve;
    keepalive 16;
}

# Keep TLS sessions/connections separate for the two certificate names.
upstream alexg_vercel_www {
    zone alexg_vercel_www 64k;
    resolver 127.0.0.53 valid=300s ipv6=off;
    server 21c71053678bfaaf.vercel-dns-017.com:443 resolve;
    keepalive 16;
}

map $host $alexg_vercel_pool {
    default alexg_vercel;
    www.alexg.mov alexg_vercel_www;
}

# Vercel's own HTTP-01 validation must retain port 80 end to end.
upstream alexg_vercel_validation {
    zone alexg_vercel_validation 64k;
    resolver 127.0.0.53 valid=300s ipv6=off;
    server 21c71053678bfaaf.vercel-dns-017.com:80 resolve;
    keepalive 4;
}

map $uri $alexg_route_class {
    default website;
    ~^/api/plugin-telemetry/?$ telemetry;
}

# No customer IP, URL/query, cookie, payload, or event identifier.
log_format alexg_ingress escape=json
    'time=$time_iso8601 route=$alexg_route_class status=$status '
    'bytes=$body_bytes_sent duration=$request_time '
    'upstream=$upstream_addr upstream_status=$upstream_status';

limit_req_zone $binary_remote_addr zone=alexg_web_requests:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=alexg_web_connections:10m;

# Included only by the two exact legacy locations.
if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
client_max_body_size 512k;
limit_req zone=sidestream_telemetry_requests burst=100 nodelay;
limit_req_status 429;
limit_conn sidestream_telemetry_connections 20;
limit_conn_status 429;
proxy_pass http://127.0.0.1:3102/api/plugin-telemetry;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header Content-Type $http_content_type;
proxy_set_header User-Agent $http_user_agent;
proxy_set_header Origin $http_origin;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Sidestream-Original-Host $host;
include /etc/nginx/snippets/sidestream-telemetry-origin-auth.conf;
proxy_connect_timeout 3s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_cache off;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;

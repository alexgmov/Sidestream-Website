# Install as /etc/nginx/conf.d/sidestream-download-limits.conf.
# Deliberately excludes client IPs, query strings, signatures, and full paths.
map $uri $sidestream_download_platform {
    default "unknown";
    ~*\.dmg$ "macos";
    ~*\.exe$ "windows";
}

map $http_range $sidestream_download_range {
    default "invalid";
    "" "none";
    ~^bytes=[0-9]+-[0-9]*$ "single";
}

limit_conn_zone $binary_remote_addr zone=sidestream_download_connections:10m;
limit_req_zone $binary_remote_addr zone=sidestream_download_requests:10m rate=12r/m;

log_format sidestream_download escape=json
    'time=$time_iso8601 platform=$sidestream_download_platform '
    'status=$status bytes=$body_bytes_sent duration=$request_time '
    'range=$sidestream_download_range upstream_duration=$upstream_response_time';

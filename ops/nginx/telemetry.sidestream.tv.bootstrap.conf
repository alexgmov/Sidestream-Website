# Certificate bootstrap only. Do not route clients here before TLS qualification.
server {
    listen 80;
    listen [::]:80;
    server_name telemetry.sidestream.tv;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}

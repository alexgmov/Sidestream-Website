# Staged legacy-client migration. See docs/alexg-legacy-telemetry-cutover.md.
server {
    listen 80;
    listen [::]:80;
    server_name alexg.mov www.alexg.mov;
    access_log /var/log/nginx/alexg-ingress.log alexg_ingress;
    error_log /var/log/nginx/alexg-ingress-error.log crit;

    # Local renewal tokens take precedence; preserve Vercel validation fallback.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri @vercel_validation;
    }
    location @vercel_validation {
        include /etc/nginx/snippets/alexg-vercel-proxy.conf;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alexg.mov www.alexg.mov;
    ssl_certificate /etc/letsencrypt/live/alexg.mov/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexg.mov/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    autoindex off;
    client_max_body_size 4500k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    access_log /var/log/nginx/alexg-ingress.log alexg_ingress;
    error_log /var/log/nginx/alexg-ingress-error.log crit;

    location = /api/plugin-telemetry {
        include /etc/nginx/snippets/alexg-legacy-telemetry.conf;
    }
    location = /api/plugin-telemetry/ {
        include /etc/nginx/snippets/alexg-legacy-telemetry.conf;
    }
    location / {
        limit_req zone=alexg_web_requests burst=200 nodelay;
        limit_req_status 429;
        limit_conn alexg_web_connections 50;
        limit_conn_status 429;
        include /etc/nginx/snippets/alexg-vercel-proxy.conf;
    }
}

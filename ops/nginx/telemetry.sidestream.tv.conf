# Prepared direct-to-Linux ingress. See docs/direct-telemetry-ingress.md.
# Do not enable without the local secret include, TLS certificate, nginx -t,
# and a verified loopback collector on port 3102.
server {
    listen 80;
    listen [::]:80;
    server_name telemetry.sidestream.tv;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Telemetry must arrive over HTTPS, never through an HTTP redirect.
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name telemetry.sidestream.tv;

    ssl_certificate /etc/letsencrypt/live/telemetry.sidestream.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telemetry.sidestream.tv/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    autoindex off;
    client_max_body_size 512k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    access_log /var/log/nginx/sidestream-telemetry.log sidestream_telemetry;
    error_log /var/log/nginx/sidestream-telemetry-error.log crit;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /v1/events {
        if ($request_method !~ ^(POST|OPTIONS)$) {
            return 405;
        }

        limit_req zone=sidestream_telemetry_requests burst=100 nodelay;
        limit_req_status 429;
        limit_conn sidestream_telemetry_connections 20;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:3102/api/plugin-telemetry;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host telemetry.sidestream.tv;
        proxy_set_header Connection "";
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Sidestream-Original-Host telemetry.sidestream.tv;

        # Root-owned mode 0600; contains only a proxy_set_header directive for
        # X-Sidestream-Origin-Auth using the existing collector service secret.
        # Populate on the server, never in Git. Incoming auth headers are dropped.
        include /etc/nginx/snippets/sidestream-telemetry-origin-auth.conf;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
    }

    # No account, payment, admin, health, filesystem, or arbitrary API proxy.
    location / {
        return 404;
    }
}

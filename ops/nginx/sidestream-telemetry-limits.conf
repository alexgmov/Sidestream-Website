# http-context configuration; install before enabling the telemetry virtual host.
# The public endpoint remains anonymous, as the existing collector is. Limits
# bound one client's load without adding a secret to distributed installers.
limit_req_zone $binary_remote_addr zone=sidestream_telemetry_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sidestream_telemetry_connections:10m;

# No IP, user agent, URL, query, event identity, request body, or credentials.
log_format sidestream_telemetry escape=json
    'time=$time_iso8601 status=$status bytes=$body_bytes_sent '
    'duration=$request_time upstream_status=$upstream_status '
    'upstream_duration=$upstream_response_time';

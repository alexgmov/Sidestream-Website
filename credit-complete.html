<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Credit purchase - Sidestream</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      align-items: center;
      background: #050506;
      color: #f5f5f7;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Helvetica, Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #171719;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      max-width: 520px;
      padding: 34px;
      width: 100%;
    }
    .eyebrow {
      color: #8fd3ff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin: 0 0 12px;
      text-transform: uppercase;
    }
    h1 { font-size: clamp(2rem, 8vw, 3.4rem); line-height: 1; margin: 0; }
    p { color: #a1a1a6; line-height: 1.55; margin: 18px 0 0; }
    .cancelled .eyebrow { color: #a1a1a6; }
  </style>
</head>
<body>
  <main id="purchase-result">
    <p id="purchase-eyebrow" class="eyebrow">Credits added</p>
    <h1 id="purchase-title">Return to Sidestream.</h1>
    <p id="purchase-copy">Your balance will refresh automatically after Stripe confirms the purchase.</p>
  </main>
  <script>
    (function () {
      var status = new URLSearchParams(window.location.search).get("status");
      if (status !== "cancelled") return;
      document.getElementById("purchase-result").classList.add("cancelled");
      document.getElementById("purchase-eyebrow").textContent = "Purchase cancelled";
      document.getElementById("purchase-title").textContent = "No credits were purchased.";
      document.getElementById("purchase-copy").textContent = "You can close this page and return to Sidestream.";
    }());
  </script>
</body>
</html>
